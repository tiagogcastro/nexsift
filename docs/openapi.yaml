openapi: 3.1.0
info:
  title: NexSift Publisher
  version: 2.0.0
  description: Publishes validated pt-BR NexSift signals and lists recently published signals.
servers:
  - url: https://oh4qzz4ivd.execute-api.us-east-1.amazonaws.com/
paths:
  /:
    get:
      operationId: listRecentPosts
      summary: List the most recently published signals
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          required: false
          description: Only signals published at or after this instant (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: topic
          in: query
          required: false
          schema:
            type: string
            enum: [ai, development, cloud, devops, security, industry, design]
        - name: signalType
          in: query
          required: false
          schema:
            type: string
            enum: [release, risk, shift, research, industry, opportunity]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: Recent signals
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/PostSummary'
        '401':
          description: Invalid publication token
    post:
      operationId: publishPost
      summary: Publish or update a NexSift signal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [post]
              properties:
                post:
                  $ref: '#/components/schemas/PostDraft'
      responses:
        '201':
          description: Signal published or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  slug:
                    type: string
                  operation:
                    type: string
                    enum: [created, updated]
                  publishedAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        '400':
          description: Malformed JSON payload
        '401':
          description: Invalid publication token
        '422':
          description: Invalid payload, editorial gate not met, or source verification failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  issues:
                    type: array
                    items:
                      type: object
        '500':
          description: Publication failed
  /validate-source:
    post:
      operationId: validateSource
      summary: Open and validate a candidate source URL
      description: Follows redirects (blocking private and metadata hosts), inspects the page and records the outcome. A URL is only publishable when the check succeeds.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Source is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceCheck'
        '401':
          description: Invalid publication token
        '422':
          description: Source rejected (404, soft-404, homepage redirect, private host, temporary failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  check:
                    $ref: '#/components/schemas/SourceCheck'
  /audit-sources:
    post:
      operationId: auditSources
      summary: Revalidate every source of every published signal
      description: Periodic routine for link rot detection. Updates the stored verification record of each source without touching editorial content.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkedAt:
                    type: string
                    format: date-time
                  checked:
                    type: integer
                  healthy:
                    type: integer
                  redirected:
                    type: integer
                  temporarily_unavailable:
                    type: integer
                  broken:
                    type: integer
                  replaced:
                    type: integer
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceAuditEntry'
        '401':
          description: Invalid publication token
  /posts/{slug}:
    get:
      operationId: getPost
      summary: Get the full signal by slug
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: ^(ai|development|cloud|devops|security|industry|design)-[a-z0-9]+(-[a-z0-9]+)*-\d{4}-\d{2}-\d{2}$
      responses:
        '200':
          description: Full signal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Invalid publication token
        '404':
          description: Signal not found
    delete:
      operationId: deletePost
      summary: Delete a signal by slug
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: ^(ai|development|cloud|devops|security|industry|design)-[a-z0-9]+(-[a-z0-9]+)*-\d{4}-\d{2}-\d{2}$
      responses:
        '200':
          description: Signal deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  slug:
                    type: string
                  deletedAt:
                    type: string
                    format: date-time
        '401':
          description: Invalid publication token
        '404':
          description: Signal not found
  /posts/{slug}/sources/{index}/replace:
    post:
      operationId: replaceSource
      summary: Replace one source after mechanically validating the new URL
      description: The new URL is opened and validated by the backend before the replacement is recorded. The original URL stays in the replacement history, so link rot can be distinguished from a source that never existed.
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            pattern: ^(ai|development|cloud|devops|security|industry|design)-[a-z0-9]+(-[a-z0-9]+)*-\d{4}-\d{2}-\d{2}$
        - name: index
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newUrl, reason]
              properties:
                newUrl:
                  type: string
                  format: uri
                reason:
                  type: string
      responses:
        '200':
          description: Updated signal with the replaced source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Invalid publication token
        '404':
          description: Signal not found
        '422':
          description: Invalid newUrl, missing reason or source index out of range
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PostDraft:
      type: object
      required:
        - title
        - description
        - content
        - whyItMatters
        - topics
        - signalDate
        - signalType
        - depth
        - sources
        - relevanceScore
        - confidenceScore
      properties:
        slug:
          type: string
          description: Optional; when present it must start with {topics[0]}- and end with -{signalDate}. The backend derives the slug itself as {topics[0]}-{slugified title, max 40 chars}-{signalDate}.
          pattern: ^(ai|development|cloud|devops|security|industry|design)-[a-z0-9]+(-[a-z0-9]+)*-\d{4}-\d{2}-\d{2}$
        title:
          type: string
          minLength: 8
          maxLength: 140
        description:
          type: string
          minLength: 30
          maxLength: 260
        content:
          type: string
          minLength: 100
          description: Markdown content in pt-BR.
        whyItMatters:
          type: string
          minLength: 30
          maxLength: 800
        topics:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum: [ai, development, cloud, devops, security, industry, design]
        signalDate:
          type: string
          format: date
          description: Actual date of the event, not the publication date.
        signalType:
          type: string
          enum: [release, risk, shift, research, industry, opportunity]
        depth:
          type: string
          enum: [practical, deep]
        tags:
          type: array
          maxItems: 10
          items:
            type: string
          default: []
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PostSource'
        relevanceScore:
          type: number
          minimum: 6.5
          maximum: 10
          description: Editorial gate. Below 6.5 the payload is rejected.
        confidenceScore:
          type: number
          minimum: 7
          maximum: 10
          description: Editorial gate. Below 7 the payload is rejected.
        featured:
          type: boolean
    Post:
      type: object
      required:
        - id
        - slug
        - title
        - description
        - content
        - whyItMatters
        - topics
        - signalDate
        - signalType
        - depth
        - sources
        - relevanceScore
        - confidenceScore
        - publishedAt
        - readingTime
        - locale
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        content:
          type: string
        whyItMatters:
          type: string
        topics:
          type: array
          items:
            type: string
        signalDate:
          type: string
          format: date
        signalType:
          type: string
        depth:
          type: string
        tags:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/PostSource'
        relevanceScore:
          type: number
        confidenceScore:
          type: number
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readingTime:
          type: integer
        locale:
          type: string
        featured:
          type: boolean
    PostSource:
      type: object
      required: [title, publisher, url]
      properties:
        title:
          type: string
        publisher:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
        editorialStatus:
          type: string
          enum: [verified, unverified, unknown]
          description: Editorial assertion that the page sustains the signal. Drafts must send verified plus editoriallyVerifiedAt; the backend never derives it from HTTP status.
        editoriallyVerifiedAt:
          type: string
          format: date-time
          description: When the editorial flow asserted the page sustains the signal. Required when editorialStatus is verified.
        firstVerifiedAt:
          type: string
          format: date-time
          description: When this URL was first verified mechanically.
        verifiedAtPublication:
          type: boolean
          description: True when the source was verified immediately before the post was stored.
        lastCheckedAt:
          type: string
          format: date-time
          description: When the backend last opened this URL.
        lastSuccessfulAt:
          type: string
          format: date-time
          description: When this URL last passed the mechanical check.
        httpStatus:
          type: integer
          description: HTTP status recorded by the last check.
        finalUrl:
          type: string
          format: uri
          description: URL after redirects (equals url when there are none).
        sourceStatus:
          type: string
          enum: [healthy, redirected, temporarily_unavailable, broken, replaced, blocked]
          description: Health state recorded by the backend. Blocked means anti-bot 403, not evidence the page is gone.
        replacements:
          type: array
          items:
            $ref: '#/components/schemas/SourceReplacement'
          description: History of URL replacements for link rot recovery.
    SourceReplacement:
      type: object
      required: [oldUrl, newUrl, replacedAt, reason]
      properties:
        oldUrl:
          type: string
          format: uri
        newUrl:
          type: string
          format: uri
        replacedAt:
          type: string
          format: date-time
        reason:
          type: string
    SourceCheck:
      type: object
      properties:
        ok:
          type: boolean
        requestedUrl:
          type: string
        finalUrl:
          type: string
        status:
          type: integer
        checkedAt:
          type: string
          format: date-time
        pageTitle:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        sourceStatus:
          type: string
          enum: [healthy, redirected, temporarily_unavailable, broken, replaced]
    SourceAuditEntry:
      type: object
      properties:
        slug:
          type: string
        url:
          type: string
        requestedUrl:
          type: string
        finalUrl:
          type: string
        httpStatus:
          type: integer
          nullable: true
        sourceStatus:
          type: string
          enum: [healthy, redirected, temporarily_unavailable, broken, replaced, blocked]
        checkedAt:
          type: string
          format: date-time
        needsReplacement:
          type: boolean
          description: True when the source is broken or blocked and no validated replacement is recorded yet.
    PostSummary:
      type: object
      required:
        - id
        - slug
        - title
        - description
        - topics
        - tags
        - signalDate
        - publishedAt
        - readingTime
        - relevanceScore
        - confidenceScore
        - signalType
        - depth
        - locale
        - sources
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        topics:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        signalDate:
          type: string
          format: date
        signalType:
          type: string
        depth:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/PostSource'
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        readingTime:
          type: integer
        relevanceScore:
          type: number
        confidenceScore:
          type: number
        locale:
          type: string
        featured:
          type: boolean
